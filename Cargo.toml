[workspace]
resolver = "2"
members = ["crates/wattwall-core", "src-tauri"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.96"
version = "0.2.0"

[workspace.dependencies]
wattwall-core = { path = "crates/wattwall-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.dev.build-override]
opt-level = 3

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
