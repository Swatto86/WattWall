<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- WattWall app icon: a four-course brick wall on a warm tile. scripts/icons.mjs renders every size from this file except 16 px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#E0283C"/>
    </linearGradient>
    <mask id="mortar">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <rect x="0" y="345" width="1024" height="36"/>
        <rect x="0" y="494" width="1024" height="36"/>
        <rect x="0" y="643" width="1024" height="36"/>
        <rect x="494" y="232" width="36" height="113"/>
        <rect x="329" y="381" width="36" height="113"/>
        <rect x="659" y="381" width="36" height="113"/>
        <rect x="494" y="530" width="36" height="113"/>
        <rect x="329" y="679" width="36" height="113"/>
        <rect x="659" y="679" width="36" height="113"/>
      </g>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="200" y="232" width="624" height="560" rx="40" fill="#fff" mask="url(#mortar)"/>
</svg>
