<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- The 16 px layer of icon.ico: three courses on whole pixels, because four blur together at this size. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#FF6A2B"/>
      <stop offset="1" stop-color="#E0283C"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="14" height="14" rx="3" fill="url(#tile)"/>
  <g fill="#fff" shape-rendering="crispEdges">
    <rect x="3" y="4" width="5" height="2"/>
    <rect x="9" y="4" width="4" height="2"/>
    <rect x="3" y="7" width="2" height="2"/>
    <rect x="6" y="7" width="4" height="2"/>
    <rect x="11" y="7" width="2" height="2"/>
    <rect x="3" y="10" width="5" height="2"/>
    <rect x="9" y="10" width="4" height="2"/>
  </g>
</svg>
