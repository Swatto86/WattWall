[package]
name = "wattwall-desktop"
version.workspace = true
description = "WattWall desktop app"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
autobins = false

[lib]
name = "wattwall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "WattWall"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
wattwall-core = { workspace = true }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Not `[lints] workspace = true`: Cargo cannot override a workspace forbid,
# and this crate must call Win32 for connection-table buffers and for closing
# an IPv6 connection (no published IPv6 equivalent of SetTcpEntry). The core
# crate keeps unsafe_code forbidden. Clippy unwrap/expect stay warnings, same
# as the workspace.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
