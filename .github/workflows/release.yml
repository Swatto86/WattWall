name: Release

on:
  push:
    tags: ["v*"]

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  release-windows:
    needs: gate
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: mozilla-actions/sccache-action@v0.0.10

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: WattWall ${{ github.ref_name }}
          releaseBody: |
            WattWall ${{ github.ref_name }}.

            - Windows 10/11 x64: `WattWall_*_x64-setup.exe` (per-machine installer, updates itself) or `WattWall_*_x64-portable.exe` (asks for administrator each launch; no logon autostart).
            - `SHA256SUMS.txt` has a checksum for every file.

            Requirements: the [Microsoft Edge WebView2 Runtime](https://developer.microsoft.com/microsoft-edge/webview2/). The installer fetches it if it is missing. The portable exe does not.

            Changes: see the [decisions](https://github.com/Swatto86/WattWall/blob/main/CONTEXT.md).
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

      - name: Stage and upload portable exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          $exe = Get-ChildItem 'src-tauri/target/release/*.exe','target/release/*.exe' -File -ErrorAction SilentlyContinue |
                 Where-Object { $_.Name -notlike '*setup*' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'No portable exe found in target/release' }
          $dest = "WattWall_${ver}_x64-portable.exe"
          Copy-Item $exe.FullName $dest -Force
          gh release upload $env:GITHUB_REF_NAME $dest --clobber --repo $env:GITHUB_REPOSITORY

  checksums:
    needs: release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --dir release-assets --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          rm -f release-assets/SHA256SUMS.txt
          ( cd release-assets && sha256sum $(ls -1 | sort) > ../SHA256SUMS.txt )
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
